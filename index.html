<!doctype html>
<html lang="es-BO">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <title>Palinal Bolivia — Próximamente</title>
    <meta
      name="description"
      content="Pinturas industriales de alta tecnología para repintado automotriz, carrocería industrial y náutica. Palinal Bolivia, próximamente."
    />
    <meta name="theme-color" content="#fbdd07" />
    <meta name="color-scheme" content="light" />
    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://palinal.bo/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,200..800&amp;display=swap"
    />
    <link
      rel="preload"
      href="assets/palinal-wordmark.png"
      as="image"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="styles.css" />

    <meta property="og:locale" content="es_BO" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Palinal Bolivia" />
    <meta property="og:title" content="Palinal Bolivia — Próximamente" />
    <meta
      property="og:description"
      content="Pinturas industriales de alta tecnología para repintado automotriz, carrocería industrial y náutica."
    />
    <meta property="og:url" content="https://palinal.bo/" />
    <meta
      property="og:image"
      content="https://palinal.bo/assets/social-preview.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://palinal.bo/assets/social-preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Palinal Bolivia — Próximamente" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Palinal Bolivia — Próximamente" />
    <meta
      name="twitter:description"
      content="Pinturas industriales de alta tecnología para repintado automotriz, carrocería industrial y náutica."
    />
    <meta
      name="twitter:image"
      content="https://palinal.bo/assets/social-preview.jpg"
    />
    <meta name="twitter:image:alt" content="Palinal Bolivia — Próximamente" />
  </head>
  <body>
    <main class="page">
      <div class="background" aria-hidden="true">
        <div class="background__sheen"></div>
        <div class="background__glow"></div>
        <div class="background__texture"></div>
        <div class="background__frame"></div>
      </div>

      <section class="content" aria-labelledby="page-title">
        <header class="brand">
          <img
            class="brand__wordmark"
            src="assets/palinal-wordmark.png"
            width="940"
            height="223"
            alt="Palinal"
            fetchpriority="high"
          />
          <div class="brand__country">
            <span aria-hidden="true"></span>
            <strong>Bolivia</strong>
            <span aria-hidden="true"></span>
          </div>
        </header>

        <div class="message">
          <h1 id="page-title">Próximamente</h1>
          <p>
            Pinturas industriales de alta tecnología para repintado automotriz,
            carrocería industrial y náutica.
          </p>
        </div>

        <div class="product">
          <img
            src="assets/palinal-lata.png"
            width="285"
            height="402"
            alt="Lata de pintura Palinal"
            decoding="async"
          />
          <div class="product__shadow" aria-hidden="true"></div>
        </div>
      </section>

      <footer class="distributor">
        <div class="distributor__rule" aria-hidden="true"></div>
        <div class="distributor__identity">
          <img
            src="assets/id3d-isotype.png"
            width="128"
            height="128"
            alt=""
            aria-hidden="true"
            decoding="async"
          />
          <p>
            Inversiones y Desarrollos 3D (ID3D), distribuidor oficial de Palinal
            en Bolivia.
          </p>
        </div>
        <address class="distributor__contact">
          <a href="mailto:sebastian@palinal.bo">sebastian@palinal.bo</a>
          <span class="distributor__location">
            <span class="distributor__dot" aria-hidden="true"></span>
            <span>Santa Cruz de la Sierra, Bolivia</span>
          </span>
        </address>
      </footer>
    </main>
  </body>
</html>
